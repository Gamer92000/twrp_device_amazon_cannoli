name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv run --python 3.10 --with pytest==9.0.2 python -m pytest -q
      - run: uvx ruff==0.16.10 check .
      - run: uvx ruff==0.16.10 format --check .
      - run: bash -n build.sh
